    <div class="wrap">
      <div class="filters" role="group" aria-label="Filter projects">
        <button type="button" data-filter="all" aria-pressed="true">All<span id="n-all"></span></button>
        <button type="button" data-filter="webflow" aria-pressed="false">Webflow<span id="n-webflow"></span></button>

<script src="projects.js"></script>
<script>
(function () {
  var list = document.getElementById('list');
  var buttons = document.querySelectorAll('.filters button');
  ['all', 'webflow', 'automation'].forEach(function (k) {
    document.getElementById('n-' + k).textContent =
      PROJECTS.filter(function (p) { return k === 'all' || p.type === k; }).length;
  });
  function show(kind) {
    renderProjects(list, function (p) { return kind === 'all' || p.type === kind; });
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.filter === kind)); });
  }
  buttons.forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.filter); history.replaceState(null, '', '#' + b.dataset.filter); });
  });
  var start = (location.hash || '').slice(1);
  show(start === 'webflow' || start === 'automation' ? start : 'all');
})();
</script>
</body>
